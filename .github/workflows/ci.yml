name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: true
      - name: Test and collect package coverage
        run: go test -coverpkg=github.com/orbit-projects/orbit-webrtc-go -coverprofile=coverage.out ./...
      - name: Enforce package coverage floor
        run: |
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | awk '$1 == "total:" { gsub(/%/, "", $3); if ($3 < 75) exit 1; found = 1 } END { if (!found) exit 1 }'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
